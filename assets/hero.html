<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mythical Agent Month hero</title>
<!--
  Photo: "Moai Rano raraku.jpg" by Aurbina, Wikimedia Commons, public domain.
  https://commons.wikimedia.org/wiki/File:Moai_Rano_raraku.jpg
  Render: headless Chrome, window 1280x640, device scale 3.
-->
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; }
  svg { display: block; }
  .serif { font-family: "Baskerville", "Libre Baskerville", Georgia, serif; }
  .sans { font-family: -apple-system, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "SF Mono", "JetBrains Mono", Menlo, monospace; }
</style>
</head>
<body>
<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" class="sans">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1020" stop-opacity="1"/>
      <stop offset="0.48" stop-color="#0b1020" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#0b1020" stop-opacity="0.72"/>
      <stop offset="0.74" stop-color="#0b1020" stop-opacity="0.2"/>
      <stop offset="0.86" stop-color="#0b1020" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.7" stop-color="#0b1020" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#0b1020"/>
  <!-- the real thing: a moai at Rano Raraku -->
  <image href="moai-rano-raraku.jpg" x="600" y="-150" width="680" height="907" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1280" height="640" fill="url(#fade)"/>
  <rect width="1280" height="640" fill="url(#bottom)"/>

  <!-- type -->
  <text x="64" y="58" class="mono" font-size="13" fill="#8b93a7">github.com/MedAdemBHA/mythical-agent-month</text>
  <text x="64" y="118" font-size="13" font-weight="700" letter-spacing="3.5" fill="#f2b766">ESTIMATES FOR AGENT-BUILT SOFTWARE</text>
  <g class="serif" fill="#f5f1ea">
    <text x="60" y="198" font-size="78" letter-spacing="-1">The Mythical</text>
    <text x="60" y="278" font-size="78" letter-spacing="-1">Agent Month</text>
  </g>
  <text x="64" y="336" class="serif" font-size="25" font-style="italic" fill="#c9cfdb">Your agent estimates like it’s 1975.</text>

  <!-- numbers -->
  <g font-size="12" font-weight="700" letter-spacing="2.2" fill="#8b93a7">
    <text x="64" y="530">THE ESTIMATE</text>
    <text x="244" y="530">THE REAL RUN</text>
    <text x="424" y="530">AGENT-HOURS</text>
  </g>
  <g class="serif" font-size="38">
    <text x="64" y="578" fill="#e8a39b">3 months</text>
    <line x1="62" y1="565" x2="208" y2="565" stroke="#e8a39b" stroke-width="2.5"/>
    <text x="244" y="578" fill="#f5f1ea">35.3 h</text>
    <text x="424" y="578" fill="#f5f1ea">64</text>
  </g>

  <!-- the chat: you (blue) and your agent, the moai (grey) -->
  <g filter="url(#soft)" font-size="16">
    <rect x="620" y="92" width="270" height="36" rx="18" fill="#0a84ff"/>
    <path d="M632 120 q-14 8 -22 6 q10 -4 10 -14 z" fill="#0a84ff"/>
    <text x="638" y="115.5" fill="#fff">how long for the full roadmap?</text>
    <rect x="682" y="138" width="216" height="36" rx="18" fill="#e9e9ec"/>
    <path d="M884 166 q14 8 22 6 q-10 -4 -10 -14 z" fill="#e9e9ec"/>
    <text x="700" y="161.5" fill="#111">realistically? 3 months</text>
    <rect x="620" y="184" width="214" height="36" rx="18" fill="#0a84ff"/>
    <path d="M632 212 q-14 8 -22 6 q10 -4 10 -14 z" fill="#0a84ff"/>
    <text x="638" y="207.5" fill="#fff">bro we ship it today 💀</text>
    <rect x="676" y="230" width="222" height="36" rx="18" fill="#e9e9ec"/>
    <path d="M884 258 q14 8 22 6 q-10 -4 -10 -14 z" fill="#e9e9ec"/>
    <text x="694" y="253.5" fill="#111">…for a team of 4, right?</text>
    <rect x="620" y="276" width="290" height="36" rx="18" fill="#0a84ff"/>
    <path d="M632 304 q-14 8 -22 6 q10 -4 10 -14 z" fill="#0a84ff"/>
    <text x="638" y="299.5" fill="#fff">you’re the team. all 6 of you. go</text>
    <rect x="702" y="322" width="196" height="36" rx="18" fill="#e9e9ec"/>
    <path d="M884 350 q14 8 22 6 q-10 -4 -10 -14 z" fill="#e9e9ec"/>
    <text x="720" y="345.5" fill="#111">done ✓ 106/106 tasks</text>
  </g>
  <text x="898" y="376" font-size="12.5" font-style="italic" fill="#f5f1ea" opacity="0.88" text-anchor="end">took 35h. we’re calling that “today” 🫠</text>
</svg>
</body>
</html>
